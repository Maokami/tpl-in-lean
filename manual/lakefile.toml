name = "tpl-in-lean-manual"
defaultTargets = ["Manual", "build-manual"]

# 별도 패키지인 이유(DESIGN.md §1.3):
#  - Verso 는 `plausible` 에 의존하고 Mathlib 도 그렇다. 한 워크스페이스에 두면
#    전이 의존성 리비전이 충돌할 위험이 있다.
#  - 문서용 Lean 버전과 라이브러리용 Lean 버전을 따로 올릴 수 있다.
# 대신 예제 프로젝트(`..`)는 이 Verso 와 **같은 태그의 subverso** 에 의존해야 한다.
[[require]]
name = "verso"
git = "https://github.com/leanprover/verso"
rev = "v4.33.0"

[[lean_lib]]
name = "Manual"

[[lean_exe]]
name = "build-manual"
root = "Main"
