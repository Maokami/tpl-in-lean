name: CI

on:
  push:
    branches: [main]
  pull_request:

# 기본은 읽기만. Pages 쓰기 권한은 실제로 배포하는 잡에서만 연다.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # `configure-pages` 는 `enablement` 가 false 라 Pages 설정을 읽기만 한다.
    # 산출물 업로드는 GITHUB_TOKEN 이 아니라 러너 토큰을 쓰므로 따로 권한이 없어도 된다.
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v5

      # elan 설치 + Mathlib 캐시만 맡기고, 빌드·테스트·린트는 아래에서 직접 돌린다.
      # 어느 단계가 깨졌는지 보이게 하려는 것이고, 순서도 우리가 정해야 하기 때문이다.
      #
      # ★ `lint: false` 가 필수다. 켜 두면 액션의 자체 lint 단계가 **빌드보다 먼저** 돌아서
      #   `unknown module prefix 'Reynolds'` 로 실패한다 (아직 olean 이 없다).
      #   린터는 빌드된 환경을 읽으므로 반드시 빌드 뒤에 와야 한다.
      - uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
          lint: false
          use-mathlib-cache: true

      # 1) Answers 와 테스트는 **경고 하나도 없이** 통과해야 한다.
      #    Exercises 는 의도적으로 `sorry` 를 갖고 있으므로 여기 포함되지 않는다
      #    (`ReynoldsTests` 가 Answers 만 import 한다).
      - name: 엄격 빌드 (Answers + 테스트)
        run: lake build --wfail ReynoldsTests

      # 2) 전체 빌드. Exercises 의 `sorry` 경고는 허용하되 **에러는 불가**.
      - name: 전체 빌드
        run: lake build

      - name: 단위 테스트
        run: lake test

      # 3) Answers 에 sorry / 불법 공리가 없는지.
      - name: Answers 검증
        run: lake exe grade --answers

      - name: 린터
        run: lake lint

      - name: Exercises 가 Answers 와 맞는지
        run: python3 scripts/gen-exercises.py --check

      - name: ANCHOR · 태그 정합성
        run: ./scripts/check-anchors.sh

      # 4) Verso 문서. 코드를 `anchor` 로 **그대로 인용**하므로, 코드가 바뀌면 여기서 깨진다.
      #    그게 목적이다 — 설명과 코드가 어긋나면 빌드가 실패해야 한다.
      #
      #    Verso 는 Mathlib 같은 캐시가 없어서 빌드 산출물을 직접 캐시한다.
      #    키는 툴체인과 의존성 리비전이라, 그 둘이 안 바뀌면 재사용된다.
      - name: Verso 빌드 캐시
        uses: actions/cache@v4
        with:
          path: manual/.lake
          key: verso-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'manual/lake-manifest.json') }}

      - name: 문서 빌드
        working-directory: manual
        run: lake exe build-manual

      # 산출물은 PR 에서도 만든다. 경로가 틀렸거나 저장소의 Pages 설정이 어긋났으면
      # main 에 머지된 뒤가 아니라 여기서 빨간불이 떠야 한다. 막는 것은 실제 배포뿐이고,
      # 그건 아래 `deploy` 잡이 맡는다.
      #
      # `path` 는 워크스페이스 루트 기준이다. 위의 `working-directory: manual` 은
      # `run` 스텝에만 걸리고 액션 입력에는 영향을 주지 않는다.
      - name: Pages 설정
        uses: actions/configure-pages@v5

      - name: 문서 산출물 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: manual/_out/html-multi

      # 5) 진행 상황을 Actions 요약 화면에 표로 렌더한다. 이것이 채점 대시보드다.
      - name: 진행 상황 요약
        if: always()
        run: |
          {
            echo "## 연습 진행 상황"
            echo
            lake exe grade 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"

  # 문서 배포. 빌드 잡의 산출물을 그대로 올린다 — 7 분짜리 빌드를 두 번 돌리지 않으려는 것이다.
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    # 줄을 세우는 대상은 배포뿐이다. 워크플로 전체에 걸면 PR CI 도 같은 그룹에 들어가고,
    # 같은 그룹에서 대기할 수 있는 실행은 하나뿐이라 세 번째 PR 이 두 번째 PR 을 취소시킨다.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages 에 배포
        id: deployment
        uses: actions/deploy-pages@v4
