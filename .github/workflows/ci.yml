name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # elan 설치 + Mathlib 캐시 + 빌드까지 처리한다.
      # `build: false` 로 두고 아래에서 단계별로 직접 돌린다 — 어느 단계가 깨졌는지 보려고.
      - uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
          use-mathlib-cache: true

      # 1) Answers 와 테스트는 **경고 하나도 없이** 통과해야 한다.
      #    Exercises 는 의도적으로 `sorry` 를 갖고 있으므로 여기 포함되지 않는다
      #    (`ReynoldsTests` 가 Answers 만 import 한다).
      - name: 엄격 빌드 (Answers + 테스트)
        run: lake build --wfail --iofail ReynoldsTests

      # 2) 전체 빌드. Exercises 의 `sorry` 경고는 허용하되 **에러는 불가**.
      - name: 전체 빌드
        run: lake build

      - name: 단위 테스트
        run: lake test

      # 3) Answers 에 sorry / 불법 공리가 없는지.
      - name: Answers 검증
        run: lake exe grade --answers

      - name: 린터
        run: lake lint

      - name: ANCHOR · 태그 정합성
        run: ./scripts/check-anchors.sh

      # 4) 진행 상황을 Actions 요약 화면에 표로 렌더한다. 이것이 채점 대시보드다.
      - name: 진행 상황 요약
        if: always()
        run: |
          {
            echo "## 연습 진행 상황"
            echo
            lake exe grade 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"
